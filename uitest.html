<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入試対策証明ジェネレーター</title>
<link rel="stylesheet" href="./css/NEW_style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <button id="new-chat" class="nav-item sidebar-item active" data-mode="generated">作成</button>
    <button class="nav-item sidebar-item" data-mode="past">復習</button>
    <button class="nav-item" id="hint-button">HINT</button>
    <button class="nav-item" id="settings-button">設定</button>
  </aside>
  <main id="app-root" class="main-area">
    <header class="mobile-header"><strong>入試対策証明ジェネレーター</strong><button id="mobile-menu" class="icon-button">☰</button></header>
    <section id="setup-view" class="setup-view">
      <div class="top-controls">
        <label class="control-block"><span>TYPE:証明の種類</span>
          <select id="filter-proof"><option value="all">CHOOSE</option><option value="congruence">合同</option><option value="similarity">相似</option><option value="equal_length">長さの等式</option></select>
        </label>
        <label class="control-block"><span>HURDLE:難易度</span>
          <select id="filter-difficulty"><option value="all">CHOOSE</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select>
        </label>
      </div>
      <button id="more-options" class="wide-button">MORE OPTIONS:詳細設定</button>
      <section id="advanced-options" class="advanced-options hidden">
        <div class="advanced-column">
          <label class="advanced-heading" for="filter-method">CRITERIA:証明方法</label>
          <select id="filter-method" class="criteria-select"><option value="all">CHOOSE</option><option value="ASA">ASA</option><option value="AA">AA</option><option value="parallelism_to_parallelogram">平行四辺形</option></select>
        </div>
        <fieldset class="feature-filter"><legend>CONDITIONS:条件</legend><div class="feature-options">
          <label><input type="checkbox" name="feature-filter" value="circle">円</label>
          <label><input type="checkbox" name="feature-filter" value="parallel">平行線</label>
          <label><input type="checkbox" name="feature-filter" value="diameter">直径</label>
          <label><input type="checkbox" name="feature-filter" value="angle_bisector">角の二等分線</label>
          <label><input type="checkbox" name="feature-filter" value="isosceles">二等辺</label>
          <label><input type="checkbox" name="feature-filter" value="parallelogram">平行四辺形</label>
          <label><input type="checkbox" name="feature-filter" value="area_ratio">面積比</label>
        </div></fieldset>
        <div class="extra-options hidden" aria-hidden="true">
          <input id="seed" type="number" tabindex="-1" aria-hidden="true">
          <input id="show-followup" type="checkbox" checked tabindex="-1" aria-hidden="true">
          <input id="rotate-figure" type="checkbox" checked tabindex="-1" aria-hidden="true">
        </div>
      </section>
      <div class="create-row"><button id="generate-button" class="create-button" type="button">作成</button></div>
    </section>

    <section id="problem-view" class="problem-view">
      <div class="problem-topline"><div id="template-badge" class="type-pill">相似</div><div id="problem-info" class="difficulty-pill">★★★★★★★★</div></div>
      <div class="problem-layout">
        <div class="figure-panel"><div class="figure-label">図</div><div id="canvas-container" class="canvas-container"></div></div>
        <article class="question-panel"><div class="figure-label">問題</div><div id="problem-text"></div><div class="conditions-block"><div class="figure-label">与えられている条件</div><ul id="conditions"></ul></div><div id="followup-block" class="followup-block hidden"><div class="figure-label">追問</div><div id="followup-text"></div></div></article>
        <article id="answer-panel-inline" class="solution-panel"><div class="figure-label">証明ステップ</div><div id="answer-content"></div></article>
      </div>
      <section class="answer-work"><h2>回答</h2><label for="proof-answer">証明を書いてください</label><textarea id="proof-answer" rows="5" placeholder="証明を入力…"></textarea><div class="work-actions"><div id="proof-result" class="proof-result">証明を入力すると、ここに判定が表示されます。</div><button id="check-proof" class="action-button">採点</button><button id="show-answer" class="action-button" aria-expanded="false">答えを見る</button></div><div id="answer-panel" class="answer-panel hidden"><div class="answer-panel-title">解答</div><div id="answer-content-duplicate"></div></div></section>
    </section>

    <div class="bottom-bar">
      <button id="save-button" class="save-button" type="button">SAVE</button>
      <div id="save-menu" class="save-menu hidden">
        <div class="save-menu-title">保存・ロード</div>
        <label class="save-name-label">問題名<input id="save-name" type="text" maxlength="80" placeholder="問題名を入力"></label>
        <button type="button" data-save-action="browser-save">ブラウザに保存</button>
        <label class="saved-select-label">保存済み問題<select id="browser-saves"><option value="">保存済み問題を選択</option></select></label>
        <button type="button" data-save-action="browser-load">選択した問題をロード</button>
        <button type="button" data-save-action="browser-delete">選択した問題を削除</button>
        <div class="menu-divider"></div>
        <button type="button" data-save-action="pc-save">JSONとしてPCに保存</button>
        <button type="button" data-save-action="pc-load">PCからJSONをロード</button>
        <input id="load-file" type="file" accept="application/json,.json" hidden>
        <div id="storage-result" class="storage-result"></div>
      </div>
      <button id="pdf-export" class="pdf-button" type="button">PDF</button>
    </div>
  </main>
</div>
<!-- main.jsとの互換性を維持するための非表示の既存操作ボタン -->
<div class="compat-controls" aria-hidden="true">
  <button id="save-pc" type="button"></button><button id="load-pc" type="button"></button>
  <button id="save-browser" type="button"></button><button id="load-browser" type="button"></button><button id="delete-browser" type="button"></button>
</div>
<script src="./js/theorem-catalog.js"></script>
<script src="./js/geometry-relations.js"></script>
<script src="./js/proof-rules.js"></script>
<script src="./js/problem-data-engine.js"></script>
<script type="module" src="./main.js"></script>
<script>
const moreOptionsButton = document.getElementById('more-options');
const advancedOptionsPanel = document.getElementById('advanced-options');
function toggleAdvancedOptions(force) {
  if (!moreOptionsButton || !advancedOptionsPanel) return;
  const shouldOpen = typeof force === 'boolean' ? force : !moreOptionsButton.classList.contains('is-open');
  moreOptionsButton.classList.toggle('is-open', shouldOpen);
  advancedOptionsPanel.classList.toggle('is-open', shouldOpen);
  advancedOptionsPanel.classList.toggle('hidden', !shouldOpen);
  moreOptionsButton.setAttribute('aria-expanded', String(shouldOpen));
}
moreOptionsButton?.addEventListener('click', () => toggleAdvancedOptions());
document.getElementById('settings-button')?.addEventListener('click', () => toggleAdvancedOptions());
document.getElementById('hint-button')?.addEventListener('click',()=>document.getElementById('show-answer')?.click());
document.getElementById('show-answer')?.addEventListener('click',()=>{
 const panel=document.getElementById('answer-panel');
 const target=document.getElementById('answer-content-duplicate');
 const source=document.getElementById('answer-content');
 if(panel && target && source) target.innerHTML=source.innerHTML;
});
document.querySelectorAll('.nav-item[data-mode]').forEach(b=>b.addEventListener('click',()=>document.getElementById('generate-button')?.click()));
</script>
</body>
</html>
